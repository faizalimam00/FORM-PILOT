name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: Do not attach personal profile exports, credentials or sensitive screenshots. Security vulnerabilities follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: FormPilot version, browser and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and fictional example
      description: Prefer a local HTML snippet or one of the five demo forms.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My report contains only fictional data and no credentials.
          required: true
